<!doctype html>
<html lang="en" data-color-scheme="%cookie-color-scheme%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="user-scalable=no, width=device-width, height=device-height, initial-scale=1, viewport-fit=cover" />
		<title>Poke Match</title>
		<meta name="description" content="Memory Match Game with Pokemons" />
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon-180x180.png">
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png">
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Ambient Canvas Backgrounds -->
		<div class="grid-background"></div>
		<div class="radial-glow"></div>

		<!-- Pre-hydration Splash Overlay -->
		<div
			id="splash"
			class="
			absolute top-8 left-0 bottom-0 right-0 flex flex-col justify-center items-center rounded-t-3xl
			[animation-delay:2s] animate-drop-out z-10 transition-colors duration-300
			"
			style="background-color: var(--bg-color); border-top: 1px solid var(--border-color); color: var(--text-primary);"
		>
			<h1 class="text-7xl font-bold mb-3 animate-slide-up-in tracking-tight">Poke Match</h1>
			<p class="text-lg opacity-0 [animation-delay:0.5s] animate-slide-up-in tracking-widest uppercase" style="color: var(--text-secondary);">
				Memory Match Game
			</p>
		</div>

		<!-- Hydration Zone -->
		<div class="opacity-0 [animation-delay:2.5s] animate-browse-in min-h-dvh">
			%sveltekit.body%
		</div>
	</body>
</html>
